name: Build Desktop Release

on:
  push:
    tags:
      - "v*"
      - "!v*b*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
          cache: npm

      - name: Configure npm retries
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches package version
        shell: pwsh
        run: |
          $pkgVersion = node -p "require('./package.json').version"
          $expectedTag = "v$pkgVersion"

          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag/version mismatch. tag=${{ github.ref_name }} package.json=$pkgVersion expected=$expectedTag"
          }

      - name: Validate icon asset
        shell: pwsh
        run: |
          if (-not (Test-Path "electron/icons/icon.png")) {
            throw "Missing icon: electron/icons/icon.png"
          }

      - name: Build Windows desktop app
        run: |
          npm run desktop:build
          npx electron-builder --win portable --publish never

      - name: Verify desktop security and regression tests
        run: |
          npm test
          npm run test:desktop-security

      - name: Upload Windows release files
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: |
            release/*.exe
            release/*.zip

      - name: Generate Windows update metadata
        shell: pwsh
        run: |
          $releaseVersion = node -p "require('./package.json').version"
          node electron/update-tools/create-version-metadata.js artifact "${{ runner.temp }}/version-metadata-win32-x64.json" x64 "release/missions-v3-mcp.$releaseVersion.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: version-metadata-win32-x64
          path: ${{ runner.temp }}/version-metadata-win32-x64.json
          if-no-files-found: error

  build-mac:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
          cache: npm

      - name: Configure npm retries
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PKG_VERSION}"

          if [ "${{ github.ref_name }}" != "$EXPECTED_TAG" ]; then
            echo "Tag/version mismatch. tag=${{ github.ref_name }} package.json=${PKG_VERSION} expected=${EXPECTED_TAG}"
            exit 1
          fi

      - name: Validate icon asset
        run: |
          test -f electron/icons/icon.png

      - name: Build macOS desktop app
        run: |
          npm run desktop:build
          npx electron-builder --mac dir zip --${{ matrix.arch }} --publish never

      - name: Generate verified update metadata
        run: node electron/update-tools/create-version-metadata.js artifact ${{ runner.temp }}/version-metadata-${{ matrix.arch }}.json ${{ matrix.arch }} release/missions-v3-mcp-${{ matrix.arch }}-mac.zip

      - name: Verify regression tests and native Mac update lifecycle
        run: |
          npm test
          npm run test:desktop-security
          npm run test:setup-updates
          npm run test:mac-update -- --auto

      - name: Upload macOS release files
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: |
            release/*.zip
            MAC_INSTRUCTIONS.md

      - name: Save update metadata for release finalization
        uses: actions/upload-artifact@v4
        with:
          name: version-metadata-${{ matrix.arch }}
          path: ${{ runner.temp }}/version-metadata-${{ matrix.arch }}.json
          if-no-files-found: error

  publish-update-metadata:
    name: Publish version.json to main and beta
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: actions/download-artifact@v4
        with:
          pattern: version-metadata-*
          path: ${{ runner.temp }}/update-metadata
          merge-multiple: true
      - name: Require all supported platform artifacts
        run: node electron/update-tools/create-version-metadata.js merge version.json "${{ runner.temp }}/update-metadata/version-metadata-arm64.json" "${{ runner.temp }}/update-metadata/version-metadata-x64.json" "${{ runner.temp }}/update-metadata/version-metadata-win32-x64.json"
      - name: Verify uploaded assets and publish the complete release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { compareVersions } = require('./electron/update-checker');
            const manifest = JSON.parse(fs.readFileSync('version.json', 'utf8'));
            const version = JSON.parse(fs.readFileSync('version.json', 'utf8'));
            const tag = context.ref.replace('refs/tags/', '');
            if (tag !== `v${manifest.version}` || version.version !== manifest.version) {
              throw new Error('Release version mismatch');
            }
            const { data: releases } = await github.rest.repos.listReleases({ ...context.repo, per_page: 100 });
            const release = releases.find(candidate => candidate.tag_name === tag);
            if (!release) throw new Error('Draft release not found');
            for (const artifact of Object.values(manifest.artifacts)) {
              const name = decodeURIComponent(new URL(artifact.url).pathname.split('/').pop());
              const uploaded = release.assets.find(asset => asset.name === name);
              if (!uploaded || uploaded.state !== 'uploaded' || uploaded.size !== artifact.size ||
                  (uploaded.digest && uploaded.digest !== `sha256:${artifact.sha256}`)) {
                throw new Error(`Uploaded release artifact does not match verified metadata: ${name}`);
              }
            }
            // Retire superseded versioned Mac downloads only after both new
            // architecture-specific ZIPs have passed the metadata checks.
            const expectedNames = new Set(Object.values(manifest.artifacts).map(artifact =>
              decodeURIComponent(new URL(artifact.url).pathname.split('/').pop())));
            for (const asset of release.assets) {
              if (/^missions-v3-mcp-.*-mac\.zip$/.test(asset.name) && !expectedNames.has(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: asset.id });
              }
            }
            const feeds = [];
            for (const branch of ['main', 'beta']) {
              const current = await github.rest.repos.getContent({ ...context.repo, path: 'version.json', ref: branch });
              const currentVersion = JSON.parse(Buffer.from(current.data.content, 'base64').toString('utf8'));
              if ((branch === 'main' && currentVersion.version !== manifest.version) ||
                  compareVersions(currentVersion.version, manifest.version) > 0) {
                throw new Error(`${branch} version.json changed during release`);
              }
              feeds.push({ branch, sha: current.data.sha });
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id,
              draft: false, make_latest: 'true', name: tag,
              body: version.notes.map(note => `- ${note}`).join('\n') +
                '\n\n**Windows:** If your current build says the update helper could not start, download this release manually once. Wallet storage and fonts are unchanged.\n' });
            for (const { branch, sha } of feeds) {
              await github.rest.repos.createOrUpdateFileContents({ ...context.repo, path: 'version.json', branch,
                sha, message: `Publish verified ${tag} update metadata to ${branch}`,
                content: Buffer.from(JSON.stringify(manifest, null, 2) + '\n').toString('base64') });
            }
