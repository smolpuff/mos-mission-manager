name: Build Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure npm retries
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

      - name: Install dependencies
        run: npm install

      - name: Validate tag matches package version
        shell: pwsh
        run: |
          $pkgVersion = node -p "require('./package.json').version"
          $expectedTag = "v$pkgVersion"

          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag/version mismatch. tag=${{ github.ref_name }} package.json=$pkgVersion expected=$expectedTag"
          }

      - name: Validate icon asset
        shell: pwsh
        run: |
          if (-not (Test-Path "electron/icons/icon.png")) {
            throw "Missing icon: electron/icons/icon.png"
          }

      - name: Build Windows desktop app
        run: |
          npm run desktop:build
          npx electron-builder --win portable --publish never

      - name: Upload Windows release files
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip

      - name: Generate Windows update metadata
        shell: pwsh
        run: |
          $releaseVersion = node -p "require('./package.json').version"
          node electron/update-tools/create-update-manifest.js artifact release/desktop-update-win32-x64.json x64 "release/missions-v3-mcp-$releaseVersion-x64-portable.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-update-win32-x64
          path: release/desktop-update-win32-x64.json
          if-no-files-found: error

  build-mac:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure npm retries
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

      - name: Install dependencies
        run: npm install

      - name: Validate tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PKG_VERSION}"

          if [ "${{ github.ref_name }}" != "$EXPECTED_TAG" ]; then
            echo "Tag/version mismatch. tag=${{ github.ref_name }} package.json=${PKG_VERSION} expected=${EXPECTED_TAG}"
            exit 1
          fi

      - name: Validate icon asset
        run: |
          test -f electron/icons/icon.png

      - name: Build macOS desktop app
        run: |
          npm run desktop:build
          npx electron-builder --mac dir zip --${{ matrix.arch }} --publish never

      - name: Generate verified update metadata
        run: node electron/update-tools/create-update-manifest.js artifact release/desktop-update-${{ matrix.arch }}.json ${{ matrix.arch }} release/missions-v3-mcp-$(node -p "require('./package.json').version")-${{ matrix.arch }}-mac.zip

      - name: Upload macOS release files
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.zip
            MAC_INSTRUCTIONS.md

      - name: Save update metadata for release finalization
        uses: actions/upload-artifact@v4
        with:
          name: desktop-update-${{ matrix.arch }}
          path: release/desktop-update-${{ matrix.arch }}.json
          if-no-files-found: error

  publish-update-metadata:
    name: Publish complete update manifest
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-update-*
          path: update-metadata
          merge-multiple: true
      - name: Require all supported platform artifacts
        run: node electron/update-tools/create-update-manifest.js merge desktop-update.json update-metadata/desktop-update-arm64.json update-metadata/desktop-update-x64.json update-metadata/desktop-update-win32-x64.json
      - name: Publish manifest after all app uploads succeed
        uses: softprops/action-gh-release@v2
        with:
          files: desktop-update.json
          fail_on_unmatched_files: true
